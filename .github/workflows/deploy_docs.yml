name: Deploy Documentation Website

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    uses: ./.github/workflows/build_docs.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ vars.IMAGE_NAME }}-image
          path: .
          pattern: ${{ vars.IMAGE_NAME }}.tar

      - name: SCP into the server
        uses: appleboy/scp-action@7e85c2e09aa21988492acd66466b5d68bda49e2b # master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: "./${{ vars.IMAGE_NAME }}.tar"
          target: "~/"

      - name: Start deployment
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            docker load -i ${{ vars.IMAGE_NAME }}.tar &&
            rm ${{ vars.IMAGE_NAME }}.tar &&
            grim up ${{ vars.IMAGE_NAME }} &&
            docker system prune -af
